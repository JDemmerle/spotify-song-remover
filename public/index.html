<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <title>Spotify song remover</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
  </head>

  <body>
    <main id="login" class="login" hidden>
      <div class="login-card">
        <h1>Playlist Song Remover</h1>
        <p>Melde dich mit Spotify an, um den aktuellen Song mit einem Tipp aus der Playlist zu löschen.</p>
        <a href="/login" class="btn btn-login">Mit Spotify anmelden</a>
      </div>
    </main>

    <main id="loggedin" class="app" hidden>
      <div class="status" role="status" aria-live="polite">
        <p id="status">Lade aktuellen Song …</p>
        <p id="info" class="status-info" hidden></p>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-action btn-remove" id="remove-song-from-playlist">Lösche Song aus Playlist</button>
        <button type="button" class="btn btn-action btn-next" id="next-song">Nächster Song</button>
      </div>
    </main>
  </body>
</html>
